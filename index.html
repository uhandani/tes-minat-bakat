<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tes Bakat Siswa SMA</title>
<style>
:root{--bg:#eef2f9;--c:#fff;--t:#0f1b3d;--m:#5b6785;--a:#2a4bd7;--l:#d3daea;--e:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#0d1326;--c:#151d36;--t:#eaf0ff;--m:#9aa8cc;--a:#7b9bff;--l:#27325a;--e:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.55 "Segoe UI",Roboto,system-ui,sans-serif}
main{max-width:620px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:1.7rem;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}
.m{color:var(--m);font-size:14px;margin:0}.er{color:var(--e);font-size:14px;min-height:20px}
.card{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:18px;margin:14px 0}
label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
input,select{width:100%;padding:11px;border:1px solid var(--l);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
button{font:inherit;font-weight:600;padding:10px 18px;border-radius:8px;border:0;background:var(--a);color:#fff;cursor:pointer}
button.g{background:none;color:var(--t);border:1px solid var(--l)}button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.o{display:block;width:100%;text-align:left;margin:8px 0;background:var(--bg);color:var(--t);border:1px solid var(--l);font-weight:400}
.o.s{border-color:var(--a);box-shadow:inset 0 0 0 2px var(--a)}
.bar{height:8px;background:var(--l);border-radius:4px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--a)}
.row{display:flex;gap:12px;justify-content:space-between;align-items:center}
</style></head><body><main id="app"></main>
<script src="soal.js"></script>
<script>
const A=document.getElementById('app'),G=i=>document.getElementById(i),S={u:null,tes:null,i:0,jw:{},hasil:{}};
const h=s=>A.innerHTML=s,esc=s=>String(s).replace(/[&<>"]/g,c=({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
function login(){h(`<h1>Tes Bakat Siswa SMA</h1><p class="m">Isi data dirimu dulu, lalu pilih tes yang ingin dikerjakan.</p><div class="card">
<label for="e">Email</label><input id="e" type="email" autocomplete="email">
<label for="n">Nama lengkap</label><input id="n" autocomplete="name">
<label for="s">NIS</label><input id="s" inputmode="numeric">
<label for="k">Kelas</label><select id="k"><option>11 A</option><option>11 B</option><option>11 C</option><option>11 D</option></select>
<p class="er" id="x"></p><button onclick="masuk()">Mulai</button></div>`)}
function masuk(){const u={email:G('e').value.trim(),nama:G('n').value.trim(),nis:G('s').value.trim(),kelas:G('k').value};
if(!/^\S+@\S+\.\S+$/.test(u.email)||u.nama.length<3||!/^\d{4,}$/.test(u.nis))return G('x').textContent='Periksa lagi: email harus valid, nama lengkap terisi, dan NIS berupa angka.';
S.u=u;menu()}
function menu(){const t=Object.keys(TES),d=Object.keys(S.hasil).length;
h(`<h1>Halo, ${esc(S.u.nama)}</h1><p class="m">${d} dari ${t.length} tes selesai</p>`+t.map(id=>{const r=S.hasil[id];
return `<div class="card row"><div><b>${TES[id].nama}</b><p class="m">${TES[id].soal.length} soal pilihan ganda</p></div>${r?`<span class="m">Selesai</span>`:`<button onclick="mulai('${id}')">Mulai</button>`}</div>`}).join('')+(d?`<button onclick="rekap()">Lihat hasil</button>`:''))}
function mulai(id){S.tes=id;S.i=0;S.jw={};tampil()}
function tampil(){const T=TES[S.tes],q=T.soal[S.i],n=T.soal.length;
h(`<p class="m">${T.nama}, soal ${S.i+1} dari ${n}</p><div class="bar"><i style="width:${(S.i+1)/n*100}%"></i></div>
<div class="card"><p>${esc(q.q)}</p>${q.o.map((o,j)=>`<button class="o ${S.jw[S.i]===j?'s':''}" onclick="pilih(${j})">${esc(o)}</button>`).join('')}</div>
<div class="row"><button class="g" ${S.i?'':'disabled'} onclick="S.i--;tampil()">Sebelumnya</button>${S.i<n-1?`<button onclick="S.i++;tampil()">Berikutnya</button>`:`<button onclick="selesai()">Selesaikan tes</button>`}</div>`)}
function pilih(j){S.jw[S.i]=j;tampil()}
function selesai(){const T=TES[S.tes];if(Object.keys(S.jw).length<T.soal.length)return alert('Masih ada soal yang belum dijawab.');
const b=T.soal.filter((q,i)=>S.jw[i]===q.k).length;S.hasil[S.tes]={benar:b,skor:Math.round(b/T.soal.length*100)};menu()}
function rekap(){h(`<h1>Hasil tes</h1><p class="m">${esc(S.u.nama)}, NIS ${esc(S.u.nis)}, kelas ${S.u.kelas}</p>`+Object.entries(S.hasil).map(([id,r])=>{
const l=r.skor>=80?'Tinggi':r.skor>=60?'Cukup':'Perlu dilatih';
return `<div class="card"><div class="row"><b>${TES[id].nama}</b><span>${r.benar}/${TES[id].soal.length}, ${l}</span></div><div class="bar"><i style="width:${r.skor}%"></i></div></div>`}).join('')+`<button class="g" onclick="menu()">Kembali</button>`)}
login()
</script></body></html>
