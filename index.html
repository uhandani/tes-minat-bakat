<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aptitude Test SMAIT Alia Tangerang</title><link rel="icon" href="logo.png">
<style>
:root{--bg:#f7f4fa;--c:#fff;--t:#1e1530;--m:#6a5f7a;--a:#67338a;--l:#ddd3e6;--e:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.55 "Segoe UI",Roboto,system-ui,sans-serif}
main{max-width:940px;margin:0 auto;padding:24px 16px 48px}.nar{max-width:620px;margin:0 auto}
h1{font-size:1.7rem;line-height:1.2;margin:0 0 8px;letter-spacing:-.02em}
.m{color:var(--m);font-size:14px;margin:0}.er{color:var(--e);font-size:14px;min-height:20px;margin:8px 0}
.card{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:18px;margin:14px 0}
.lg{display:grid;gap:20px}@media(min-width:760px){.lg{grid-template-columns:1fr 1fr;align-items:start}}
.hero{background:#4a1f6b;color:#fff;border-radius:14px;padding:26px}
.hero h1{font-size:2rem}.hero p{margin:0 0 16px;color:#e0cff0}
.hero li{list-style:none;display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid rgba(255,255,255,.18)}
.hero ul{margin:0;padding:0}.hero li span:last-child{color:#f5e51b;font-weight:600}
label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
input,select{width:100%;padding:11px;border:1px solid var(--l);border-radius:8px;background:#fff;color:var(--t);font:inherit}
.ck{display:flex;align-items:center;font-weight:400;margin-top:16px}.ck input{width:auto;margin-right:10px}
button{font:inherit;font-weight:600;padding:11px 20px;border-radius:8px;border:0;background:var(--a);color:#fff;cursor:pointer}
button.g{background:none;color:var(--t);border:1px solid var(--l)}button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #67338a;outline-offset:2px}
.o{display:block;width:100%;text-align:left;margin:8px 0;background:#fff;color:var(--t);border:1px solid var(--l);font-weight:400}
.o.s{border-color:var(--a);background:#f1e8f7;box-shadow:inset 0 0 0 2px var(--a)}
.bar{height:8px;background:var(--l);border-radius:4px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--a)}
.row{display:flex;gap:12px;justify-content:space-between;align-items:center}.tm{font-size:1.3rem;font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:14px;padding:10px max(16px,calc((100% - 940px)/2));background:#fff;border-bottom:4px solid #f5e51b}.top img{height:54px;width:auto}.top b{display:block;font-size:1.2rem;letter-spacing:.05em;color:#4a1f6b;line-height:1.2}.top span{font-size:13px;letter-spacing:.07em;color:var(--m)}
</style></head><body><header class="top"><img src="logo.png" alt="Logo SMAIT Alia Tangerang"><div><b>APTITUDE TEST</b><span>SMAIT ALIA TANGERANG</span></div></header><main id="app"></main>
<script src="soal.js"></script>
<script>
const URUT=[['verbal','Verbal',8],['numerical','Numerical Reasoning',10],['logical','Logical Reasoning',10],['abstract','Abstract Reasoning',10],['spatial','Spatial Reasoning',10],['mechanical','Mechanical Reasoning',10],['perceptual','Perceptual Reasoning',5],['creative','Creative Potential',10]];
const DUR=Object.fromEntries(URUT.map(([i,,m])=>[i,m]));
const A=document.getElementById('app'),G=i=>document.getElementById(i),S={u:null,tes:null,i:0,jw:{},hasil:{},end:0,iv:0};
const h=s=>A.innerHTML=s,esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
function login(){h(`<div class="lg"><section class="hero"><h1>Delapan tes bakat</h1><p>Bacalah bismillah sebelum memulai. Setiap tes punya waktu sendiri dan berhenti otomatis saat waktu habis.</p><ul>${URUT.map(([,n,m])=>`<li><span>${n}</span><span>${m} menit</span></li>`).join('')}</ul></section>
<section class="card"><h2 style="margin:0 0 4px;font-size:1.2rem">Data peserta</h2><p class="m">Isi dengan benar, lalu pilih tes yang ingin dikerjakan.</p>
<label for="e">Email</label><input id="e" type="email" autocomplete="email">
<label for="n">Nama lengkap</label><input id="n" autocomplete="name">
<label for="s">NIS</label><input id="s" inputmode="numeric">
<label for="k">Kelas</label><select id="k"><option>11 A</option><option>11 B</option><option>11 C</option><option>11 D</option></select>
<label class="ck"><input type="checkbox" id="j">Saya mengerjakan tes ini dengan jujur.</label>
<p class="er" id="x"></p><button onclick="masuk()">Mulai</button></section></div>`)}
function masuk(){const u={email:G('e').value.trim(),nama:G('n').value.trim(),nis:G('s').value.trim(),kelas:G('k').value};
if(!/^\S+@\S+\.\S+$/.test(u.email)||u.nama.length<3||!/^\d{4,}$/.test(u.nis))return G('x').textContent='Periksa lagi: email harus valid, nama lengkap terisi, dan NIS berupa angka.';
if(!G('j').checked)return G('x').textContent='Centang pernyataan kejujuran dulu.';
S.u=u;menu()}
function menu(){const t=URUT.filter(([id])=>TES[id]),d=Object.keys(S.hasil).length;
h(`<div class="nar"><h1>Halo, ${esc(S.u.nama)}</h1><p class="m">${d} dari ${t.length} tes selesai. Waktu mulai berjalan saat kamu menekan Mulai.</p>`+t.map(([id,n,m])=>{const r=S.hasil[id];
return `<div class="card row"><div><b>${n}</b><p class="m">${TES[id].soal.length} soal, ${m} menit</p></div>${r?`<span class="m">Selesai</span>`:`<button onclick="mulai('${id}')">Mulai</button>`}</div>`}).join('')+(d?`<button onclick="rekap()">Lihat hasil</button>`:'')+`</div>`)}
function mulai(id){S.tes=id;S.i=0;S.jw={};S.end=Date.now()+DUR[id]*60000;clearInterval(S.iv);S.iv=setInterval(tik,1000);tampil()}
function tik(){const el=G('tm');if(!el||!S.tes)return;const s=Math.max(0,Math.round((S.end-Date.now())/1000));
el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');el.style.color=s<=60?'var(--e)':'inherit';if(s<=0)selesai(true)}
function tampil(){const T=TES[S.tes],q=T.soal[S.i],n=T.soal.length;
h(`<div class="nar"><div class="row"><p class="m">${T.nama}, soal ${S.i+1} dari ${n}</p><b class="tm" id="tm"></b></div><div class="bar"><i style="width:${(S.i+1)/n*100}%"></i></div>
<div class="card"><p>${esc(q.q)}</p>${q.o.map((o,j)=>`<button class="o ${S.jw[S.i]===j?'s':''}" onclick="pilih(${j})">${esc(o)}</button>`).join('')}</div>
<div class="row"><button class="g" ${S.i?'':'disabled'} onclick="S.i--;tampil()">Sebelumnya</button>${S.i<n-1?`<button onclick="S.i++;tampil()">Berikutnya</button>`:`<button onclick="selesai()">Selesaikan tes</button>`}</div></div>`);tik()}
function pilih(j){S.jw[S.i]=j;tampil()}
function selesai(auto){const T=TES[S.tes];if(!T)return;if(!auto&&Object.keys(S.jw).length<T.soal.length)return alert('Masih ada soal yang belum dijawab.');
clearInterval(S.iv);const b=T.soal.filter((q,i)=>S.jw[i]===q.k).length;S.hasil[S.tes]={benar:b,skor:Math.round(b/T.soal.length*100)};S.tes=null;
if(auto)alert('Waktu habis. Jawabanmu sudah disimpan.');menu()}
function rekap(){h(`<div class="nar"><h1>Hasil tes</h1><p class="m">${esc(S.u.nama)}, NIS ${esc(S.u.nis)}, kelas ${S.u.kelas}</p>`+Object.entries(S.hasil).map(([id,r])=>{
const l=r.skor>=80?'Tinggi':r.skor>=60?'Cukup':'Perlu dilatih';
return `<div class="card"><div class="row"><b>${TES[id].nama}</b><span>${r.benar}/${TES[id].soal.length}, ${l}</span></div><div class="bar"><i style="width:${r.skor}%"></i></div></div>`}).join('')+`<button class="g" onclick="menu()">Kembali</button></div>`)}
login()
</script></body></html>
